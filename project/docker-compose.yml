services:
  minio:
    image: minio/minio:RELEASE.2023-10-07T15-07-38Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  etl-app:
    build: .
    container_name: etl-app
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - INPUT_BUCKET=input-data
      - OUTPUT_BUCKET=output-data
    volumes:
      - ./logs:/app/logs
    # Не монтируем test_data, чтобы генерировать внутри контейнера
    command: >
      sh -c "
      echo 'Waiting for MinIO...' &&
      sleep 10 &&
      python -c \"import sys; sys.path.append('.'); from test_data.generate_test_data import generate_simple_test_data; generate_simple_test_data()\" &&
      python scripts/upload_test_data.py &&
      python src/main.py
      "

volumes:
  minio_data: